{% include 'base.html' %}


{% block content %}

<h1>{{title}}</h1>
{% if not poles %}
<p>Ни одного поля пока не создано
    {% else %}
<ul>
    {% for pole in poles %}
    <li><a href="{{ pole.get_absolute_url }}">{{ pole.name }}</a></li>

    {% endfor %}
</ul>
{% endif %}

<h2>Создать поле</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Создать</button>
</form>
{% endblock %}
